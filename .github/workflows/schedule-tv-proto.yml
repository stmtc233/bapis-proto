name: Schedule TV BAPIS Proto

on:
  workflow_dispatch:
  schedule:
    - cron: '53 2 * * *'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TV update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-proto.yml --repo "$GITHUB_REPOSITORY" --ref tv
