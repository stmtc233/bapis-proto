name: Update BAPIS Proto

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the release for an existing version.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: bapis-proto-update
  cancel-in-progress: false

env:
  APK_PAGE_URL: https://apkcombo.com/bilibili/com.bilibili.app.in/old-versions/
  APK_PACKAGE: com.bilibili.app.in
  JADX_VERSION: 1.5.6
  MIN_MESSAGE_COUNT: 3500

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes aapt protobuf-compiler

      - name: Download APK and read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          old_versions="$(curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' \
            "$APK_PAGE_URL")"
          release_path="$(printf '%s' "$old_versions" | grep -oE '/bilibili/com\.bilibili\.app\.in/download/phone-6[^" ]+-apk' | head -n 1)"
          test -n "$release_path"
          release_page="https://apkcombo.com${release_path}"
          release_html="$(curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' \
            "$release_page")"
          apk_url="$(RELEASE_HTML="$release_html" node --input-type=module -e '
            const html = process.env.RELEASE_HTML;
            const match = html.match(/href="(\/r2\?u=[^"]+\.apks[^"]*)"/);
            if (!match) process.exit(1);
            console.log(new URL(match[1].replaceAll("&amp;", "&"), "https://apkcombo.com").href);
          ')"
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' \
            --output .work/bilibili.xapk "$apk_url"
          manifest_json="$(unzip -p .work/bilibili.xapk manifest.json)"
          version_name="$(jq -r '.version_name' <<< "$manifest_json")"
          version_code="$(jq -r '.version_code' <<< "$manifest_json")"
          base_apk="$(jq -r '.split_apks[] | select(.id == "base") | .file' <<< "$manifest_json")"
          test "$version_name" != null
          test "$version_code" != null
          test -n "$base_apk"
          case "$version_code" in ''|*[!0-9]*) echo "Invalid version code: $version_code" >&2; exit 1;; esac
          mkdir -p .work/apks
          unzip -q .work/bilibili.xapk "$base_apk" -d .work/apks
          badging="$(aapt dump badging ".work/apks/$base_apk")"
          package_name="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
          test "$package_name" = "$APK_PACKAGE"
          case "$version_name" in 6.[0-9]* ) ;; *) echo "Unexpected international version: $version_name" >&2; exit 1;; esac

          tag="international-v${version_name}"
          apk_sha256="$(sha256sum .work/bilibili.xapk | cut -d ' ' -f 1)"
          git fetch --tags --force
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && inputs.force }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "$force_rebuild" != 'true' ]; then
            tag_exists=true
          else
            tag_exists=false
          fi
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "apk_file=$base_apk"
            echo "apk_page_url=$release_page"
            echo "tag=$tag"
            echo "apk_sha256=$apk_sha256"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Download JADX
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            --output .work/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q .work/jadx.zip -d .work/jadx

      - name: Decompile dex files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/dex
          unzip -q ".work/apks/${{ steps.version.outputs.apk_file }}" 'classes*.dex' -d .work/dex
          rm -rf decompiled
          javac -cp .work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
            -d .work/classes tools/DecompileBapis.java tools/ListBapisDex.java tools/FindProtoRuntimeDex.java
          runtime_dex="$(java -cp .work/classes:.work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
            FindProtoRuntimeDex .work/dex/classes*.dex)"
          test -f "$runtime_dex"
          bapis_dex_count=0
          while read -r dex _; do
            bapis_dex_count=$((bapis_dex_count + 1))
            echo "Decompiling $dex with protobuf runtime context"
            if [ "$dex" = "$runtime_dex" ]; then
              java -Xms512m -Xmx3g \
                -cp .work/classes:.work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
                DecompileBapis decompiled "$dex"
            else
              java -Xms512m -Xmx3g \
                -cp .work/classes:.work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
                DecompileBapis decompiled "$dex" "$runtime_dex"
            fi
          done < <(java -cp .work/classes:.work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
            ListBapisDex .work/dex/classes*.dex)
          test "$bapis_dex_count" -gt 0

      - name: Reconstruct proto files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node extract_bapis_proto.mjs
          message_count="$(jq -r '.messageCount' extracted_proto/com/bapis/MANIFEST.json)"
          if [ "$message_count" -lt "$MIN_MESSAGE_COUNT" ]; then
            echo "Only $message_count protobuf messages were recovered; expected at least $MIN_MESSAGE_COUNT." >&2
            exit 1
          fi

      - name: Validate all generated proto files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd extracted_proto/com/bapis
          mapfile -d '' proto_files < <(find . -type f -name '*.proto' -print0 | sort -z)
          test "${#proto_files[@]}" -gt 0
          protoc \
            --proto_path=. \
            --proto_path=/usr/include \
            --descriptor_set_out="$GITHUB_WORKSPACE/.work/bapis.pb" \
            --include_imports \
            "${proto_files[@]}"

      - name: Record generated source
        if: steps.version.outputs.tag_exists != 'true'
        env:
          APK_SHA256: ${{ steps.version.outputs.apk_sha256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          jq -n \
            --arg apk_url "${{ steps.version.outputs.apk_page_url }}" \
            --arg package_name "$APK_PACKAGE" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            '{apk_url: $apk_url, package_name: $package_name, apk_sha256: $apk_sha256, version_code: $version_code, version_name: $version_name}' \
            > extracted_proto/SOURCE.json

      - name: Commit and tag new schema
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f extracted_proto
          if ! git diff --cached --quiet; then
            git commit -m "chore(proto): update to ${VERSION_NAME}"
            git push origin HEAD
          fi
          git tag -fa "$TAG" -m "BAPIS proto ${VERSION_NAME}"
          git push origin "refs/tags/$TAG" --force

      - name: Publish or replace release
        if: steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
