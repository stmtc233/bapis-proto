name: Update BAPIS Proto

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: bapis-proto-update
  cancel-in-progress: false

env:
  APK_URL: https://dl.hdslb.com/mobile/latest/android64/iBiliPlayer-bili.apk?t=20260817
  JADX_VERSION: 1.5.6
  APKTOOL_VERSION: 2.12.1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download APK and read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          curl --fail --location --retry 3 --retry-delay 5 \
            --output .work/bilibili.apk "$APK_URL"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output .work/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar .work/apktool.jar d --force --no-src --no-res \
            .work/bilibili.apk --output .work/apktool >/dev/null

          manifest=.work/apktool/AndroidManifest.xml
          version_name="$(sed -nE 's/.*android:versionName="([^"]+)".*/\1/p' "$manifest" | head -n 1)"
          version_code="$(sed -nE 's/.*android:versionCode="([^"]+)".*/\1/p' "$manifest" | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          case "$version_name" in *[!0-9A-Za-z._-]*|'') exit 1;; esac

          tag="v${version_name}"
          apk_sha256="$(sha256sum .work/bilibili.apk | cut -d ' ' -f 1)"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=$tag"
            echo "apk_sha256=$apk_sha256"
            echo "tag_exists=$tag_exists"
            echo "release_exists=$release_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Download JADX
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            --output .work/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q .work/jadx.zip -d .work/jadx

      - name: Decompile dex files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/dex
          unzip -q .work/bilibili.apk 'classes*.dex' -d .work/dex
          rm -rf decompiled
          JAVA_OPTS='-Xms512m -Xmx6g' \
            .work/jadx/bin/jadx --output-dir decompiled --threads-count 2 .work/dex/classes*.dex

      - name: Reconstruct proto files
        if: steps.version.outputs.tag_exists != 'true'
        run: node extract_bapis_proto.mjs

      - name: Record generated source
        if: steps.version.outputs.tag_exists != 'true'
        env:
          APK_SHA256: ${{ steps.version.outputs.apk_sha256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          jq -n \
            --arg apk_url "$APK_URL" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            '{apk_url: $apk_url, apk_sha256: $apk_sha256, version_code: $version_code, version_name: $version_name}' \
            > extracted_proto/SOURCE.json

      - name: Commit and tag new schema
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f extracted_proto
          if ! git diff --cached --quiet; then
            git commit -m "chore(proto): update to ${VERSION_NAME}"
            git push origin HEAD
          fi
          git tag -a "$TAG" -m "BAPIS proto ${VERSION_NAME}"
          git push origin "$TAG"

      - name: Publish release
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
