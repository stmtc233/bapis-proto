name: Update BAPIS Proto

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the release for an existing version.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: bapis-proto-update
  cancel-in-progress: false

env:
  APK_URL: https://dl.hdslb.com/mobile/latest/android64/iBiliPlayer-bili.apk?t=20260817
  JADX_VERSION: 1.5.6
  MIN_MESSAGE_COUNT: 3000

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Android asset packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes aapt

      - name: Download APK and read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36' \
            --referer 'https://www.bilibili.com/' \
            --output .work/bilibili.apk "$APK_URL"
          badging="$(aapt dump badging .work/bilibili.apk)"
          version_name="$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
          version_code="$(sed -nE "s/.*versionCode='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          case "$version_name" in *[!0-9A-Za-z._-]*|'') exit 1;; esac

          tag="v${version_name}"
          apk_sha256="$(sha256sum .work/bilibili.apk | cut -d ' ' -f 1)"
          git fetch --tags --force
          force_rebuild="${{ github.event_name == 'workflow_dispatch' && inputs.force }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "$force_rebuild" != 'true' ]; then
            tag_exists=true
          else
            tag_exists=false
          fi
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=$tag"
            echo "apk_sha256=$apk_sha256"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Download JADX
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            --output .work/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q .work/jadx.zip -d .work/jadx

      - name: Decompile dex files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/dex
          unzip -q .work/bilibili.apk 'classes*.dex' -d .work/dex
          rm -rf decompiled
          javac -cp .work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
            -d .work/classes tools/DecompileBapis.java
          java -Xms512m -Xmx6g \
            -cp .work/classes:.work/jadx/lib/jadx-${JADX_VERSION}-all.jar \
            DecompileBapis decompiled .work/dex/classes*.dex

      - name: Reconstruct proto files
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node extract_bapis_proto.mjs
          message_count="$(jq -r '.messageCount' extracted_proto/com/bapis/MANIFEST.json)"
          if [ "$message_count" -lt "$MIN_MESSAGE_COUNT" ]; then
            echo "Only $message_count protobuf messages were recovered; expected at least $MIN_MESSAGE_COUNT." >&2
            exit 1
          fi

      - name: Record generated source
        if: steps.version.outputs.tag_exists != 'true'
        env:
          APK_SHA256: ${{ steps.version.outputs.apk_sha256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          jq -n \
            --arg apk_url "$APK_URL" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            '{apk_url: $apk_url, apk_sha256: $apk_sha256, version_code: $version_code, version_name: $version_name}' \
            > extracted_proto/SOURCE.json

      - name: Commit and tag new schema
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f extracted_proto
          if ! git diff --cached --quiet; then
            git commit -m "chore(proto): update to ${VERSION_NAME}"
            git push origin HEAD
          fi
          git tag -fa "$TAG" -m "BAPIS proto ${VERSION_NAME}"
          git push origin "refs/tags/$TAG" --force

      - name: Publish or replace release
        if: steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
